        '503':
          $ref: '#/components/responses/Error'
  /admin/statistics:
    get:
      operationId: getAdminStatistics
      summary: 平台管理员读取全局统计
      description: 仅当前活跃平台 admin。任务/评论排除软删除，包含归档项目；admins 是活跃管理员数。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatisticsEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: 管理员分页查询用户
      description: status=all/active/disabled，role=all/admin/user，关键词匹配邮箱或昵称；仅返回公开管理字段。
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: keyword
          in: query
          schema: {type: string, maxLength: 100}
        - name: status
          in: query
          schema: {type: string, default: all}
        - name: role
          in: query
          schema: {type: string, enum: [all, admin, user], default: all}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /admin/users/{userId}/status:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
    patch:
      operationId: changeUserStatus
      summary: 禁用或启用用户并撤销旧会话
      description: 不能禁用自己。状态实际改变时递增 session_version 并清理 Redis 会话；Redis 清理失败也不会使旧会话恢复。禁止自动转让 owner 或清空分配。相同状态不重复审计。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /admin/teams:
    get:
      operationId: listAdminTeams
      summary: 查看所有团队基本资料及数量
      description: status=all/active/archived，关键词匹配名称或简介。此能力不授予团队任务访问或编辑权限。
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: keyword
          in: query
          schema: {type: string, maxLength: 100}
        - name: status
          in: query
          schema: {type: string, default: all}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTeamPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /admin/teams/{teamId}/archive:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
    post:
      operationId: adminArchiveTeam
      summary: 平台管理员归档异常团队
      description: reason 必填，保留所有权和历史；平台审计、团队日志、归档同事务；已归档返回 409。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminArchiveRequest'
      responses:
        '204':
          description: 成功
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: taskflow_session
  responses:
    Error:
      description: 400 参数错误；401 登录失效；403 权限不足；404 资源不存在或不可访问；409 状态冲突；429 限流；503 依赖不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    HealthEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [alive, ready, not_ready]
            checks:
              type: object
              properties:
                mysql:
                  $ref: '#/components/schemas/CheckState'
                redis:
                  $ref: '#/components/schemas/CheckState'
                migrations:
                  $ref: '#/components/schemas/CheckState'
    CheckState:
      type: string
      enum: [ok, unavailable]
    UserEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, nickname, platform_role, created_at]
      properties:
        id:
          type: string
          pattern: '^[1-9][0-9]*$'
        email:
          type: string
          format: email
        nickname:
          type: string
        platform_role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, nickname, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: ASCII 邮箱，首尾空白会移除，并统一转小写
        nickname:
          type: string
          minLength: 1
          maxLength: 40
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 至少 8 个 Unicode 字符，且 UTF-8 编码不超过 72 字节
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ProfileRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 40
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 与原密码不同；至少 8 个 Unicode 字符，且 UTF-8 编码不超过 72 字节
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        request_id:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    Team:
      type: object
      required: [id, name, description, owner_id, my_role, member_count, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
        my_role:
          type: string
          enum: [owner, admin, member]
        member_count:
          type: integer
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Member:
      type: object
      required: [user_id, nickname, email, role, status, joined_at]
      properties:
        user_id:
          type: string
        nickname:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, disabled]
        joined_at:
          type: string
          format: date-time
    Invite:
      type: object
      required: [id, team_id, expires_at, max_uses, used_count, revoked_at, created_by, created_at, status]
      properties:
        id:
          type: string
        team_id:
          type: string
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: integer
        used_count:
          type: integer
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked, expired, exhausted]
          description: 团队归档时即使邀请码仍显示 active 也不能加入
    Activity:
      type: object
      required: [id, team_id, project_id, actor_id, actor_nickname, action, target_type, target_id, metadata, created_at]
      properties:
        project_id:
          type: string
          nullable: true
          description: 团队级操作为 null，项目级操作为项目 ID
        id:
          type: string
        team_id:
          type: string
        actor_id:
          type: string
        actor_nickname:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
          default: ''
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
    TeamRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          type: string
    JoinTeamRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: 完整邀请码；前后空白会移除，码本身区分大小写
    CreateTeamInviteRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        max_uses:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    TeamEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/Team'
    TeamPageEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [items, page, page_size, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Team'
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
              format: int64
    MemberPageEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [items, page, page_size, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Member'
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
              format: int64
    InvitePageEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [items, page, page_size, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Invite'
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
              format: int64
    ActivityPageEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [items, page, page_size, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Activity'
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
              format: int64
    InviteCreatedEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [invite, code]
          properties:
            invite:
              $ref: '#/components/schemas/Invite'
            code:
              type: string
              description: 仅此响应返回，列表不再提供，不进入日志
    JoinedTeamEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [team, already_joined]
          properties:
            team:
              $ref: '#/components/schemas/Team'
            already_joined:
              type: boolean
    Project:
      type: object
      required: [id, team_id, team_name, my_role, team_archived_at, name, description, created_by, creator_nickname, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
        team_id:
          type: string
        team_name:
          type: string
        my_role:
          type: string
          enum: [owner, admin, member]
        team_archived_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
        creator_nickname:
          type: string
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
          default: ''
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
    ProjectEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/Project'
    ProjectPageEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [items, page, page_size, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
              format: int64
    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          default: ''
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        assignee_id:
          type: string
          nullable: true
          description: 当前团队活跃成员的用户 ID；null 或省略表示未分配
        due_at:
          type: string
          format: date
          nullable: true
          description: YYYY-MM-DD，有效年份 1000—9999；null 或省略表示无截止日期
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: version 与至少一个业务字段；省略字段不变，仅负责人/日期支持显式 null 清空
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignee_id:
          type: string
          nullable: true
        due_at:
          type: string
          format: date
          nullable: true
    MoveTaskRequest:
      type: object
      additionalProperties: false
      required: [version, status]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/TaskStatus'
        before_task_id:
          type: string
          nullable: true
          description: 插入到同项目目标列该任务前；null 或省略放到列末
    Task:
      type: object
      required: [id, project_id, project_name, team_id, team_name, my_role, project_archived_at, team_archived_at, title, description, status, priority, assignee_id, assignee_nickname, created_by, creator_nickname, due_at, is_overdue, position, version, can_delete, created_at, updated_at]
      properties:
        id:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        team_id:
          type: string
        team_name:
          type: string
        my_role:
          type: string
          enum: [owner, admin, member]
        title:
          type: string
        description:
          type: string
        assignee_id:
          type: string
          nullable: true
        assignee_nickname:
          type: string
          nullable: true
        created_by:
          type: string
        creator_nickname:
          type: string
        due_at:
          type: string
          nullable: true
          format: date
        project_archived_at:
          type: string
          nullable: true
          format: date-time
        team_archived_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        is_overdue:
          type: boolean
        can_delete:
          type: boolean
        position:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 1
    TaskPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
          minimum: 0
          description: 项目任务列表包含；我的任务响应不含此字段
    BoardColumn:
      type: object
      required: [status, items, total, page_size, has_more]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          format: int64
          description: 本列符合筛选条件的实际总数
        page_size:
          type: integer
          enum: [50]
        has_more:
          type: boolean
    Board:
      type: object
      required: [project, revision, columns]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        revision:
          type: integer
          format: int64
          minimum: 0
        columns:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/BoardColumn'
    TaskEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/Task'
    TaskPageEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/TaskPage'
    BoardEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/Board'
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 去除前后空白后校验，纯文本，不能全为空白
    UpdateCommentRequest:
      type: object
      additionalProperties: false
      required: [content, version]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        version:
          type: integer
          format: int64
          minimum: 1
    Comment:
      type: object
      required: [id, task_id, author_id, author_nickname, content, version, can_edit, can_delete, created_at, updated_at]
      properties:
        id:
          type: string
        task_id:
          type: string
        author_id:
          type: string
        author_nickname:
          type: string
        content:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        can_edit:
          type: boolean
        can_delete:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CommentEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/Comment'
    CommentPageEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [items, page, page_size, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
              format: int64
    CountGroup:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
    AssigneeStatistics:
      type: object
      required: [user_id, nickname, total, completed, overdue]
      properties:
        user_id:
          type: string
          nullable: true
          description: null 表示未分配，始终包含未分配组，即使为零
        nickname:
          type: string
        total:
          type: integer
          format: int64
          minimum: 0
        completed:
          type: integer
          format: int64
          minimum: 0
        overdue:
          type: integer
          format: int64
          minimum: 0
    Statistics:
      type: object
      required: [scope, team_id, project_id, name, archived, as_of, today, timezone, total, completed, uncompleted, overdue, completion_rate, by_status, by_priority, by_assignee]
      properties:
        scope:
          type: string
          enum: [team, project]
        team_id:
          type: string
        project_id:
          type: string
          nullable: true
          description: 团队统计为 null
        name:
          type: string
        archived:
          type: boolean
          description: 团队或当前项目归档；归档仍可读取统计
        as_of:
          type: string
          format: date-time
        today:
          type: string
          format: date
          description: 本次请求使用的上海日历日期
        timezone:
          type: string
          enum: [Asia/Shanghai]
        total:
          type: integer
          format: int64
          minimum: 0
        completed:
          type: integer
          format: int64
          minimum: 0
        uncompleted:
          type: integer
          format: int64
          minimum: 0
        overdue:
          type: integer
          format: int64
          minimum: 0
        completion_rate:
          type: number
          minimum: 0
          maximum: 100
          description: 已完成/总数的百分比，四舍五入一位小数；无任务时为 0
        by_status:
          type: array
          minItems: 4
          maxItems: 4
          description: 固定 todo/in_progress/in_review/done 顺序，补足零值
          items:
            $ref: '#/components/schemas/CountGroup'
        by_priority:
          type: array
          minItems: 4
          maxItems: 4
          description: 固定 low/medium/high/urgent 顺序，补足零值
          items:
            $ref: '#/components/schemas/CountGroup'
        by_assignee:
          type: array
          minItems: 1
          description: 有任务的负责人及未分配组；不是全部团队成员，不分页
          items:
            $ref: '#/components/schemas/AssigneeStatistics'
    StatisticsEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/Statistics'
