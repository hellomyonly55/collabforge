openapi: 3.0.3
info:
  title: CollabForge API
  version: 1.0.0
  description: CollabForge 1.0，阶段 0—8 已完成，已实现协作业务、任务统计和平台管理员后台。初始管理员只能通过 CLI 创建，无默认密码或公开提权接口。ID 输出为字符串，密码不进入响应。
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: 检查 HTTP 进程存活，不要求依赖可用
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /health/ready:
    get:
      operationId: getReadiness
      summary: 检查真实 MySQL、Redis 和迁移状态
      responses:
        '200':
          description: 全部依赖可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: 至少一个依赖不可用；data.checks 包含诊断状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /auth/register:
    post:
      operationId: register
      summary: 注册用户，成功后前往登录页
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      summary: 登录并设置 7 天 HttpOnly 会话 Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax、Path=/；HTTPS 来源启用 Secure；退出或改密时清除
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: 撤销当前会话并清除 Cookie，可重复调用
      responses:
        '204':
          description: 成功
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax、Path=/；HTTPS 来源启用 Secure；退出或改密时清除
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      summary: 查询当前用户
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateMe
      summary: 修改当前用户昵称
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /me/password:
    put:
      operationId: changePassword
      summary: 验证原密码并更新密码，撤销所有会话
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '204':
          description: 成功
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax、Path=/；HTTPS 来源启用 Secure；退出或改密时清除
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams:
    get:
      operationId: listTeams
      summary: 列出本人加入的团队
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, archived]
            default: all
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: createTeam
      summary: 创建团队，当前用户成为所有者
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/join:
    post:
      operationId: joinTeam
      summary: 使用邀请码加入；已加入时不扣次数
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinTeamRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinedTeamEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    get:
      operationId: getTeam
      summary: 查看团队详情
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTeam
      summary: 所有者或管理员编辑团队资料
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/archive:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    post:
      operationId: archiveTeam
      summary: 所有者归档团队；归档后仅可查看
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 成功
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/leave:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    post:
      operationId: leaveTeam
      summary: 退出团队；所有者必须先转让
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 成功
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/transfer-ownership:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    post:
      operationId: transferTeam
      summary: 转让给其他活跃成员，原所有者成为管理员
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/members:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    get:
      operationId: listTeamMembers
      summary: 列出当前成员
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/members/{userId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
      - name: userId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    patch:
      operationId: setMemberRole
      summary: 所有者设置管理员或普通成员
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRoleRequest'
      responses:
        '204':
          description: 成功
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeMember
      summary: 所有者移除非所有者；管理员仅可移除普通成员
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 成功
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/invites:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    get:
      operationId: listTeamInvites
      summary: 所有者或管理员查看邀请元数据，不返回原始码
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: createTeamInvite
      summary: 生成邀请码，仅在创建响应显示一次
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamInviteRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreatedEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/invites/{inviteId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    delete:
      operationId: revokeTeamInvite
      summary: 所有者或管理员撤销邀请码，可重复调用
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 成功
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/activities:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    get:
      operationId: listTeamActivities
      summary: 团队成员读取真实操作日志
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: action
          in: query
          description: 准确操作代码，例如 comment.created、task.moved；未知类型返回 400
          schema:
            type: string
        - name: target_type
          in: query
          description: team/user/invite/project/task/comment
          schema:
            type: string
        - name: actor_id
          in: query
          description: 正整数 ID 字符串，允许查询历史离队成员
          schema:
            type: string
        - name: project_id
          in: query
          description: 可选项目 ID，与路由所属团队或项目同时约束，不能跨范围读取
          schema:
            type: string
        - name: from
          in: query
          description: 包含时区的 RFC3339 时间，开始边界包含，例如 2026-10-31T00:00:00+08:00
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 包含时区的 RFC3339 时间，结束边界包含；早于 from 返回 400
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /teams/{teamId}/projects:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    get:
      operationId: listProjects
      summary: 当前团队成员查看项目列表
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: 仅按项目自身 archived_at 筛选；团队归档时全部项目仍只读
          schema:
            type: string
            enum: [all, active, archived]
            default: all
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: createProject
      summary: 团队所有者或管理员创建项目
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        description: uint64 范围内的正整数 ID 字符串
    get:
      operationId: getProject
      summary: 按当前团队成员关系查看项目
      security:
        - sessionCookie: []
      responses:
        '200':
